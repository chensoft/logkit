[package]
name = "logkit"
version = "0.3.7"
edition = "2021"
authors = ["Jian Chen <admin@chensoft.com>"]
license = "MIT"
description = "Super fast, structured, scalable logging library for Rust"
documentation = "https://docs.rs/logkit"
repository = "https://github.com/chensoft/logkit"
readme = "README.md"
keywords = ["log", "logger", "logging"]

[features]
default = ["trace", "debug", "info", "warn", "error"]
trace = []
debug = []
info = []
warn = []
error = []

[dependencies]
chrono = "0.4"
encoder = "0.2"
backtrace = "0.3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false
